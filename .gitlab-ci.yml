workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      auto_cancel:
        on_new_commit: interruptible
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(.+\/)?v[0-9]+\.[0-9]+\.[0-9]+$/'

default:
  interruptible: true

include:
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/mise@master
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/go@master
    inputs:
      major_version: "0"
      minor_version: "4"
      tag_version: "false"

variables:
  PLATFORMS: "linux/amd64,linux/arm64"
  CI_IMAGE: registry.gitlab.com/crusoeenergy/tools/go-ci-1.26

# Paths whose change makes the functest jobs run.
.code-changes:
  changes:
    - go.mod
    - go.*
    - '*.gitlab-ci.yml'
    - Makefile
    - '*.mk'
    - mise.toml
    - mise.lock
    - Dockerfile*
    - cmd/**/*
    - internal/**/*
    - scripts/**/*
    - '**/*.go'

# Exercises this build of the driver on a real CMK cluster, the same suite region-coordinator and
# kubernetes-manager gate on. Without -csi-image the suite tests whichever driver the cluster version
# ships, which for this repo would mean gating a change on the released driver; -csi-image puts the
# image published by publish_artifacts on the CSI workloads first.
#
# The pull secret uses CI_JOB_TOKEN, which is valid for the life of the job. The pods pull during the
# job, so there is no need for a long-lived deploy token.
functest:
  stage: deploy
  image: $CI_IMAGE:master
  tags:
    - x86-crusoecloud_build_prod-docker-build
  interruptible: false
  needs:
    # Optional because publish_artifacts is itself filtered by changes. A hard need on a job the
    # pipeline excluded makes the whole pipeline invalid.
    - job: publish_artifacts
      optional: true
  # A run is 30 to 45 minutes and GitLab's default job timeout is 60, which would kill the job at
  # about the same moment the Go timeout fires: no JUnit, and after_script not guaranteed to run, so
  # the staging claim leaks and blocks region-coordinator's functests too. Job timeout sits above the
  # Go timeout (50m, see functest-ci) so the suite always reports and cleanup always runs.
  timeout: 90m
  before_script:
    - go env -w "GOPRIVATE=${CI_SERVER_HOST}"
    - echo -e "machine ${CI_SERVER_HOST} login gitlab-ci-token password ${CI_JOB_TOKEN}" > ~/.netrc
  variables:
    CI_API_ENDPOINT_ENV: "staging"
    # No project or key mapping here. region-coordinator's staging functest references none of these,
    # so CI_PROJECT_ID_CRUSOE_TEST_ACC and the access keys already resolve for the group and point at
    # the staging functest project.
    CI_PUB_SSH_KEY_CRUSOE_TEST_ACC: "$CI_PUB_SSH_KEY"
    CI_PRIV_SSH_KEY_CRUSOE_TEST_ACC: "$CI_PRIV_SSH_KEY"
    # 1.33 ships a driver new enough that the shared-volume tests run rather than gate-skip.
    FUNCTEST_CLUSTER_VERSION: "1.33.4-cmk.24"
    CSI_IMAGE_REGISTRY_USER: "gitlab-ci-token"
    CSI_IMAGE_REGISTRY_PASSWORD: "$CI_JOB_TOKEN"
  script:
    # The commit SHA tag is pushed for every published image, and alwaysBuild in artifacts.yml
    # makes glci publish it on every run.
    # Report every missing variable at once rather than one failed job per variable.
    - make functest-preflight CSI_IMAGE="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
    - make functest-ci CSI_IMAGE="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
  after_script:
    - make functest-ci-cleanup
  # Only one functest can hold the staging cluster at a time.
  resource_group: functest-resource-group
  artifacts:
    when: always
    paths:
      - functests.xml
    reports:
      junit: functests.xml
  rules:
    # Automatic and blocking on MRs to the default branch, which is the only long-lived branch in
    # this repo, so it is the point where a change reaches everyone. A run provisions a cluster and
    # takes 30 to 45 minutes. That cost is affordable here because changes are infrequent and come
    # from one maintainer; region-coordinator and kubernetes-manager take continuous changes from
    # several teams, which is why they gate a promotion branch instead of their trunk.
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      changes: !reference [.code-changes, changes]
    # An MR stacked onto another feature branch gets an on-demand run instead. Same changes filter as
    # above: without it a docs-only MR offers a functest button while publish_artifacts is filtered out,
    # and there would be no image to test.
    - if: '$CI_MERGE_REQUEST_ID'
      changes: !reference [.code-changes, changes]
      when: manual
      allow_failure: true

# Gates crusoe-csi-driver version changes, upgrade and rollback, over mounted volumes. functest
# above is a fresh-install gate: it installs one image on a clean cluster and never swaps the
# driver under running pods. This job installs the released baseline first, holds an fs (RWX) and
# an ssd (RWO) volume mounted by co-located pods, then swaps to this build, back to the baseline,
# and to this build again. Each swap checks that in-place mounts survive, a kubelet restart keeps
# them, a replacement pod remounts, and scale-to-zero leaves nothing behind; after the last swap the
# node has to be clean and every disk detached. See TestKubernetesUpgradeSuite in the testing repo.
#
# Shares functest's staging claim (same resource_group), so the two run one at a time against the
# single staging cluster rather than fighting over it or needing two clusters at once.
functest-upgrade:
  stage: deploy
  image: $CI_IMAGE:master
  tags:
    - x86-crusoecloud_build_prod-docker-build
  interruptible: false
  needs:
    - job: publish_artifacts
      optional: true
  # Same budget and reasoning as functest: job timeout above the Go timeout so the suite always
  # reports and after_script always releases the claim.
  timeout: 90m
  before_script:
    - go env -w "GOPRIVATE=${CI_SERVER_HOST}"
    - echo -e "machine ${CI_SERVER_HOST} login gitlab-ci-token password ${CI_JOB_TOKEN}" > ~/.netrc
  variables:
    CI_API_ENDPOINT_ENV: "staging"
    CI_PUB_SSH_KEY_CRUSOE_TEST_ACC: "$CI_PUB_SSH_KEY"
    CI_PRIV_SSH_KEY_CRUSOE_TEST_ACC: "$CI_PRIV_SSH_KEY"
    FUNCTEST_CLUSTER_VERSION: "1.33.4-cmk.24"
    CSI_IMAGE_REGISTRY_USER: "gitlab-ci-token"
    CSI_IMAGE_REGISTRY_PASSWORD: "$CI_JOB_TOKEN"
  script:
    - make functest-preflight CSI_IMAGE="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
    # Baseline = the chart's published appVersion (the released driver), resolved at runtime rather
    # than pinned here. A pinned tag rots at the next chart release: it moved v0.4.12 -> v0.4.13
    # mid-development, and a stale pin would test a released -> candidate step that no longer matches
    # what customers upgrade from. Set CSI_BASELINE_IMAGE as a CI variable to override if the fetch
    # ever needs pinning.
    - |
      if [ -z "${CSI_BASELINE_IMAGE:-}" ]; then
        appVersion=$(curl -fsSL "https://raw.githubusercontent.com/crusoecloud/crusoe-csi-driver-helm-charts/release/charts/crusoe-csi-driver/Chart.yaml" \
          | sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}.*/\1/p')
        if [ -z "$appVersion" ]; then
          echo "could not resolve the chart's published appVersion for the baseline image" >&2
          exit 1
        fi
        CSI_BASELINE_IMAGE="ghcr.io/crusoecloud/crusoe-csi-driver:${appVersion}"
      fi
      echo "upgrade baseline image: ${CSI_BASELINE_IMAGE}"
      make functest-upgrade-ci \
        CSI_IMAGE="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" \
        CSI_BASELINE_IMAGE="${CSI_BASELINE_IMAGE}"
  after_script:
    - make functest-ci-cleanup
  resource_group: functest-resource-group
  artifacts:
    when: always
    paths:
      - functests-upgrade.xml
    reports:
      junit: functests-upgrade.xml
  rules:
    # Same as functest: automatic and blocking on MRs to the default branch, on-demand for stacked
    # MRs. A staging flake blocks the MR until the job is retried, which functest already does too.
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      changes: !reference [.code-changes, changes]
    - if: '$CI_MERGE_REQUEST_ID'
      changes: !reference [.code-changes, changes]
      when: manual
      allow_failure: true

# Remove the tag_semver and pages jobs from merges into main.
# The tag_semver job will be run using a GitHub action instead

# The GitHub release workflow tags and publishes this repo, and no godoc site is wanted.
go_publish_docs:
  rules:
    - when: never

publish_pages:
  rules:
    - when: never
