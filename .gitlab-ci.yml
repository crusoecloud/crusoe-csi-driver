include:
  - project: 'crusoeenergy/tools'
    file: '/templates/go.gitlab-ci.yml'

default:
  tags:
    - x86-crusoecloud_build_prod-docker-build

variables:
  CI_IMAGE: registry.gitlab.com/crusoeenergy/tools/go-ci-1.24

test_and_lint:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "release"'
      changes: !reference [.code-changes, changes]
    - if: '$CI_MERGE_REQUEST_ID'
      changes: !reference [.code-changes, changes]
    # don't run CI for semver tags, do run it for custom tags
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(.+\/)?v[0-9]+\.[0-9]+\.[0-9]+$/'

build_and_push:
  needs: []
  script:
    - |-
      if [ "${BUILD_IN_SUBPATH:-true}" == "true" ]; then
        cd ${SUBPROJECT_REL_PATH}
      fi
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    # Build an image based on the commit ref, this will be available
    # internally for testing feature branches and testing pre-release versions
    - docker buildx create --use --name crusoe-csi-driver-builder
    - |
      docker buildx build --no-cache --pull \
      -f "${DOCKERFILE:-./Dockerfile}" \
      --build-arg CI_SERVER_HOST="$CI_SERVER_HOST" \
      --build-arg CI_JOB_TOKEN="$CI_JOB_TOKEN" \
      --build-arg CRUSOE_CSI_DRIVER_VERSION="$CI_COMMIT_REF_NAME" \
      --platform linux/amd64,linux/arm64 \
      -t "$RELEASE_IMAGE:${CI_COMMIT_REF_NAME##*/}" \
      --push .


# Exercises this build of the driver on a real CMK cluster, the same suite region-coordinator and
# kubernetes-manager gate on. Without -csi-image the suite tests whichever driver the cluster version
# ships, which for this repo would mean gating a change on the released driver; -csi-image puts the
# image built by build_and_push on the CSI workloads first.
#
# The pull secret uses CI_JOB_TOKEN, which is valid for the life of the job. The pods pull during the
# job, so there is no need for a long-lived deploy token.
functest:
  stage: test
  image: $CI_IMAGE:master
  needs:
    - job: build_and_push
  before_script:
    - go env -w "GOPRIVATE=${CI_SERVER_HOST}"
    - echo -e "machine ${CI_SERVER_HOST} login gitlab-ci-token password ${CI_JOB_TOKEN}" > ~/.netrc
  variables:
    CI_API_ENDPOINT_ENV: "staging"
    # No project or key mapping here. region-coordinator's staging functest references none of these,
    # so CI_PROJECT_ID_CRUSOE_TEST_ACC and the access keys already resolve for the group and point at
    # the staging functest project.
    CI_PUB_SSH_KEY_CRUSOE_TEST_ACC: "$CI_PUB_SSH_KEY"
    CI_PRIV_SSH_KEY_CRUSOE_TEST_ACC: "$CI_PRIV_SSH_KEY"
    # 1.33 ships a driver new enough that the shared-volume tests run rather than gate-skip.
    FUNCTEST_CLUSTER_VERSION: "1.33.4-cmk.24"
    CSI_IMAGE_REGISTRY_USER: "gitlab-ci-token"
    CSI_IMAGE_REGISTRY_PASSWORD: "$CI_JOB_TOKEN"
  script:
    # Derive the tag exactly as build_and_push does, off the same RELEASE_IMAGE, so this cannot drift
    # from what was actually pushed. CI_COMMIT_REF_SLUG would not match: it rewrites the branch rather
    # than stripping the prefix, so npujari/CRUSOE-1 becomes npujari-crusoe-1 instead of CRUSOE-1.
    - make functest-ci CSI_IMAGE="${RELEASE_IMAGE}:${CI_COMMIT_REF_NAME##*/}"
  after_script:
    - make functest-ci-cleanup
  # Only one functest can hold the staging cluster at a time.
  resource_group: functest-resource-group
  artifacts:
    when: always
    paths:
      - functests.xml
    reports:
      junit: functests.xml
  rules:
    # Automatic on release MRs, manual elsewhere: a run provisions a cluster and takes 30 to 45
    # minutes, which is too slow to sit on every MR, but being able to trigger it on any MR is how
    # you check a change before it reaches release.
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
    - if: '$CI_MERGE_REQUEST_ID'
      when: manual
      allow_failure: true

# Remove the tag_semver and pages jobs from merges into main.
# The tag_semver job will be run using a GitHub action instead
# and new versions will be pushed then.
tag_semver:
  rules:
    - when: never

code_intelligence:
  rules:
    - when: never

pages:
  rules:
    - when: never
